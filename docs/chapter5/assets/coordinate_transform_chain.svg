<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590">
  <title>机械臂坐标系与齐次变换链</title>
  <desc>展示世界、相机、机械臂基座、七个关节和夹爪中心之间的坐标变换关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.t{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a}.b{font-weight:700}.s{font-size:15px}.m{font-size:18px}.l{font-size:22px}</style>
  </defs>
  <rect width="1100" height="590" fill="#f8fafc"/>
  <text x="550" y="38" text-anchor="middle" class="t b" font-size="25">先统一坐标系，再做 FK / IK：本章全部目标使用 arm_base_link</text>

  <g stroke-width="2.5">
    <rect x="35" y="90" width="175" height="105" rx="17" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="260" y="90" width="175" height="105" rx="17" fill="#fef3c7" stroke="#d97706"/>
    <rect x="485" y="90" width="175" height="105" rx="17" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="710" y="90" width="175" height="105" rx="17" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="935" y="90" width="130" height="105" rx="17" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g class="t" text-anchor="middle">
    <text x="122" y="125" class="b l">世界 / 导航</text><text x="122" y="156" class="m">world</text><text x="122" y="180" class="s">底盘移动后会变化</text>
    <text x="347" y="125" class="b l">视觉目标</text><text x="347" y="156" class="m">camera</text><text x="347" y="180" class="s">检测点或抓取位姿</text>
    <text x="572" y="125" class="b l">机械臂基座</text><text x="572" y="156" class="m">arm_base_link</text><text x="572" y="180" class="s">FK / J / IK 统一参考系</text>
    <text x="797" y="125" class="b l">关节链</text><text x="797" y="156" class="m">J1 → … → J7</text><text x="797" y="180" class="s">逐段相乘</text>
    <text x="1000" y="125" class="b l">夹爪中心</text><text x="1000" y="154" class="s">gripper_*_</text><text x="1000" y="176" class="s">center_link</text>
  </g>
  <g stroke="#475569" stroke-width="4" marker-end="url(#arrow)">
    <line x1="210" y1="142" x2="252" y2="142"/><line x1="435" y1="142" x2="477" y2="142"/><line x1="660" y1="142" x2="702" y2="142"/><line x1="885" y1="142" x2="927" y2="142"/>
  </g>

  <rect x="115" y="228" width="870" height="66" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="255" text-anchor="middle" class="t b m">若目标来自 world 或 camera：先变换到 arm_base_link，再交给 IK</text>
  <text x="550" y="280" text-anchor="middle" class="t s">不要把“世界坐标中的点”直接当成“机械臂基座坐标中的点”。</text>

  <rect x="55" y="330" width="455" height="205" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="282" y="365" text-anchor="middle" class="t b l">齐次变换同时保存位置和姿态</text>
  <g transform="translate(105,390)">
    <rect x="0" y="0" width="260" height="120" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="82" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="185" y="0" width="75" height="82" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="82" width="185" height="38" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <rect x="185" y="82" width="75" height="38" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="92" y="48" text-anchor="middle" class="t b l">R</text><text x="222" y="48" text-anchor="middle" class="t b l">p</text>
    <text x="92" y="108" text-anchor="middle" class="t m">0ᵀ</text><text x="222" y="108" text-anchor="middle" class="t b m">1</text>
  </g>
  <text x="410" y="425" class="t m">R：朝向</text><text x="410" y="460" class="t m">p：位置</text><text x="410" y="495" class="t s">T ∈ SE(3)</text>

  <rect x="550" y="330" width="495" height="205" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="797" y="365" text-anchor="middle" class="t b l">机械臂正运动学就是变换链相乘</text>
  <g class="t" text-anchor="middle">
    <rect x="580" y="405" width="90" height="56" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="625" y="440" class="b m">T₁(q₁)</text>
    <rect x="700" y="405" width="90" height="56" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="745" y="440" class="b m">T₂(q₂)</text>
    <text x="817" y="442" class="b l">…</text>
    <rect x="850" y="405" width="90" height="56" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="895" y="440" class="b m">T₇(q₇)</text>
    <rect x="965" y="405" width="60" height="56" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="995" y="440" class="b s">Ttool</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)"><line x1="670" y1="433" x2="692" y2="433"/><line x1="790" y1="433" x2="806" y2="433"/><line x1="830" y1="433" x2="842" y2="433"/><line x1="940" y1="433" x2="957" y2="433"/></g>
  <text x="797" y="500" text-anchor="middle" class="t b m">Tbaseᵉᵉ = T₁ T₂ ··· T₇ Ttool</text>
</svg>
