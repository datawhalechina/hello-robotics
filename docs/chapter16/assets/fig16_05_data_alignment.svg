<text x="70.0" y="229.4" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#18334B">三路相机图像 + qpos[0] + 任务文字</text>
<text x="70.0" y="263.4" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#18334B">qpos 是实测状态，不是未来动作标签</text>
