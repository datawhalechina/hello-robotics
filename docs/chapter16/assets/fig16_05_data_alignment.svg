<text x="50.0" y="61.7" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#18334B">图 16-5｜一条训练样本：当前状态与未来命令怎样对齐？</text>
<text x="50.0" y="108.4" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#54697D">示例取条件索引 c = 0；原始记录 30 Hz，16 个动作和 8 帧未来视频覆盖同一个约 1.6 秒窗口。</text>
