<rect width="1600" height="930" fill="#F5F8FC"/>
<text x="50.0" y="61.7" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#18334B">图 16-4｜联合流匹配：训练学习更新方向，推理从噪声生成结果</text>
<text x="50.0" y="108.4" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#54697D">上下两条生成轨迹相互联系；当前图像、实测状态与任务语言始终是已知条件。</text>
<rect x="50" y="150" width="1500" height="145" rx="16" fill="#FFFFFF" stroke="#2463B5" stroke-width="2"/>
<text x="70.0" y="189.1" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#2463B5">训练：知道真值，制造带噪样本，再学习视频与动作的速度场</text>
<text x="70.0" y="229.4" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#18334B">视频真值 + 视频噪声 → 带噪视频；动作真值 + 动作噪声 → 带噪动作</text>
<text x="70.0" y="263.4" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#18334B">视频与动作分别采样噪声时间；联合目标 = 视频损失 + 动作损失（本章权重均为 1）</text>
<text x="50.0" y="363.8" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#18334B">推理：未知未来，从两组随机噪声共同出发</text>
