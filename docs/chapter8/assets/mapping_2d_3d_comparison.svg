<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker><style>.title{font:700 24px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}.label{font:18px Arial,"Microsoft YaHei",sans-serif;fill:#17324d}.small{font:14px Arial,"Microsoft YaHei",sans-serif;fill:#38546b}.panel{fill:#f7fbfe;stroke:#7ba3bf;stroke-width:2}.occ{fill:#263238}.free{fill:#f7f7f7;stroke:#c5c5c5}.unknown{fill:#b8b8b8}.voxel{fill:#74a9cf;stroke:#315b7d;stroke-width:1.5}</style></defs>
  <rect width="1100" height="520" rx="18" fill="#fbfdff" stroke="#c8d7e3"/>
  <text x="550" y="40" text-anchor="middle" class="title">同一批点云可以生成 2D 占据栅格，也可以生成 3D 体素点云地图</text>
  <rect x="40" y="80" width="485" height="385" rx="18" class="panel"/><text x="282" y="115" text-anchor="middle" class="label">2D：射线更新自由区与占据端点</text>
  <circle cx="145" cy="275" r="18" fill="#e76f51"/><text x="145" y="315" text-anchor="middle" class="small">雷达原点</text>
  <line x1="165" y1="275" x2="390" y2="190" stroke="#2a9d8f" stroke-width="4" marker-end="url(#arrow)"/><line x1="165" y1="275" x2="420" y2="275" stroke="#2a9d8f" stroke-width="4" marker-end="url(#arrow)"/><line x1="165" y1="275" x2="390" y2="360" stroke="#2a9d8f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="385" y="175" width="32" height="32" class="occ"/><rect x="415" y="259" width="32" height="32" class="occ"/><rect x="385" y="344" width="32" height="32" class="occ"/>
  <rect x="75" y="390" width="24" height="24" class="free"/><text x="110" y="408" class="small">自由</text><rect x="175" y="390" width="24" height="24" class="occ"/><text x="210" y="408" class="small">占据</text><rect x="285" y="390" width="24" height="24" class="unknown"/><text x="320" y="408" class="small">未知</text>
  <rect x="575" y="80" width="485" height="385" rx="18" class="panel"/><text x="817" y="115" text-anchor="middle" class="label">3D：空间分桶并累计每个体素的均值点</text>
  <g transform="translate(685,175)"><rect x="0" y="90" width="55" height="55" class="voxel"/><rect x="60" y="90" width="55" height="55" class="voxel"/><rect x="120" y="90" width="55" height="55" class="voxel"/><rect x="180" y="90" width="55" height="55" class="voxel"/><rect x="60" y="30" width="55" height="55" class="voxel"/><rect x="120" y="30" width="55" height="55" class="voxel"/><rect x="120" y="-30" width="55" height="55" class="voxel"/><circle cx="24" cy="118" r="4" fill="#e76f51"/><circle cx="78" cy="115" r="4" fill="#e76f51"/><circle cx="145" cy="60" r="4" fill="#e76f51"/><circle cx="150" cy="0" r="4" fill="#e76f51"/><circle cx="205" cy="118" r="4" fill="#e76f51"/></g>
  <text x="817" y="380" text-anchor="middle" class="small">保存每个有效体素的 (x, y, z, intensity) 均值</text>
  <text x="817" y="415" text-anchor="middle" class="small">本章 3D 地图表达“表面点”，不是完整三维占据/自由空间</text>
</svg>
