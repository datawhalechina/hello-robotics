<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.t{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a}.b{font-weight:700}.h{font-size:26px}.m{font-size:18px}.s{font-size:14px}.xs{font-size:12px}.box{stroke-width:2}</style>
  </defs>
  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="550" y="40" text-anchor="middle" class="t b h">图像和文字如何进入同一个多模态 Transformer</text>
  <text x="550" y="68" text-anchor="middle" class="t s">两种输入先分别编码，再对齐为相同隐藏维度，最后组成一条混合 token 序列</text>

  <rect x="45" y="110" width="220" height="175" rx="18" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="155" y="142" text-anchor="middle" class="t b m">图像输入 H × W</text>
  <g stroke="#60a5fa" stroke-width="1.5" fill="#eff6ff">
    <rect x="92" y="162" width="126" height="90"/>
    <line x1="123.5" y1="162" x2="123.5" y2="252"/><line x1="155" y1="162" x2="155" y2="252"/><line x1="186.5" y1="162" x2="186.5" y2="252"/>
    <line x1="92" y1="192" x2="218" y2="192"/><line x1="92" y1="222" x2="218" y2="222"/>
  </g>
  <text x="155" y="272" text-anchor="middle" class="t xs">切分为 P × P patch</text>

  <rect x="325" y="110" width="220" height="175" rx="18" fill="#dcfce7" stroke="#22c55e" class="box"/>
  <text x="435" y="144" text-anchor="middle" class="t b m">视觉编码器</text>
  <text x="435" y="180" text-anchor="middle" class="t s">Patch Embedding</text>
  <text x="435" y="209" text-anchor="middle" class="t s">Vision Transformer</text>
  <text x="435" y="238" text-anchor="middle" class="t s">区域间注意力交互</text>
  <text x="435" y="266" text-anchor="middle" class="t xs">得到 Nvision 个视觉向量</text>

  <rect x="605" y="110" width="220" height="175" rx="18" fill="#fef3c7" stroke="#f59e0b" class="box"/>
  <text x="715" y="144" text-anchor="middle" class="t b m">视觉—语言连接</text>
  <text x="715" y="180" text-anchor="middle" class="t s">压缩 / 投影视觉特征</text>
  <text x="715" y="209" text-anchor="middle" class="t s">统一隐藏维度</text>
  <text x="715" y="238" text-anchor="middle" class="t s">加入二维位置表示</text>
  <text x="715" y="266" text-anchor="middle" class="t xs">使语言模型可接收视觉 token</text>

  <rect x="885" y="110" width="170" height="175" rx="18" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
  <text x="970" y="144" text-anchor="middle" class="t b m">文字输入</text>
  <text x="970" y="181" text-anchor="middle" class="t s">系统规则</text>
  <text x="970" y="210" text-anchor="middle" class="t s">用户指令</text>
  <text x="970" y="239" text-anchor="middle" class="t s">检测摘要</text>
  <text x="970" y="266" text-anchor="middle" class="t xs">Tokenizer → 文本 token</text>

  <g stroke="#475569" stroke-width="4" marker-end="url(#arrow)">
    <line x1="265" y1="198" x2="315" y2="198"/><line x1="545" y1="198" x2="595" y2="198"/>
  </g>

  <rect x="90" y="350" width="920" height="95" rx="18" fill="#ffffff" stroke="#64748b" class="box"/>
  <text x="550" y="380" text-anchor="middle" class="t b m">混合序列</text>
  <g class="t b s" text-anchor="middle">
    <rect x="130" y="396" width="135" height="34" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="197" y="418">system token</text>
    <rect x="282" y="396" width="130" height="34" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="347" y="418">视觉 token 1</text>
    <rect x="425" y="396" width="130" height="34" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="490" y="418">视觉 token …</text>
    <rect x="568" y="396" width="130" height="34" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="633" y="418">视觉 token N</text>
    <rect x="715" y="396" width="125" height="34" rx="8" fill="#ede9fe" stroke="#8b5cf6"/><text x="777" y="418">user token</text>
    <rect x="855" y="396" width="115" height="34" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="912" y="418">回答起点</text>
  </g>
  <path d="M715 285 V320 H550 V340" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M970 285 V320 H550 V340" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <line x1="550" y1="445" x2="550" y2="482" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="250" y="490" width="600" height="82" rx="18" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="550" y="523" text-anchor="middle" class="t b m">共享语言模型联合注意视觉与文字</text>
  <text x="550" y="552" text-anchor="middle" class="t s">自回归生成文字或结构化 JSON；输出仍不是米制坐标和控制指令</text>
</svg>
