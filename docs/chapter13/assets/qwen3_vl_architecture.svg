<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="deep" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
    <style>.t{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#0f172a}.b{font-weight:700}.h{font-size:26px}.m{font-size:18px}.s{font-size:14px}.xs{font-size:12px}.box{stroke-width:2}</style>
  </defs>
  <rect width="1100" height="650" fill="#f8fafc"/>
  <text x="550" y="40" text-anchor="middle" class="t b h">Qwen3-VL 在本章中的多模态推理主链路</text>
  <text x="550" y="68" text-anchor="middle" class="t s">下图是教学化抽象：突出视觉编码、DeepStack、位置表示和结构化生成的职责</text>

  <rect x="45" y="115" width="190" height="105" rx="18" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="140" y="150" text-anchor="middle" class="t b m">观察板图像</text>
  <text x="140" y="180" text-anchor="middle" class="t s">候选框、颜色标签</text>
  <text x="140" y="203" text-anchor="middle" class="t xs">静态 RGB 图像</text>

  <rect x="45" y="270" width="190" height="105" rx="18" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
  <text x="140" y="305" text-anchor="middle" class="t b m">文本上下文</text>
  <text x="140" y="335" text-anchor="middle" class="t s">系统规则、用户任务</text>
  <text x="140" y="358" text-anchor="middle" class="t xs">检测摘要与候选集合</text>

  <rect x="305" y="95" width="235" height="300" rx="20" fill="#ecfeff" stroke="#0891b2" class="box"/>
  <text x="422" y="130" text-anchor="middle" class="t b m">视觉 Transformer</text>
  <rect x="340" y="158" width="165" height="48" rx="10" fill="#cffafe" stroke="#06b6d4"/><text x="422" y="188" text-anchor="middle" class="t s">浅层：边缘与纹理</text>
  <rect x="340" y="229" width="165" height="48" rx="10" fill="#a5f3fc" stroke="#06b6d4"/><text x="422" y="259" text-anchor="middle" class="t s">中层：局部结构</text>
  <rect x="340" y="300" width="165" height="48" rx="10" fill="#67e8f9" stroke="#0891b2"/><text x="422" y="330" text-anchor="middle" class="t s">深层：物体语义</text>
  <text x="422" y="376" text-anchor="middle" class="t xs">不同深度保留不同粒度的视觉信息</text>

  <rect x="620" y="125" width="185" height="110" rx="18" fill="#fef3c7" stroke="#f59e0b" class="box"/>
  <text x="712" y="159" text-anchor="middle" class="t b m">视觉投影</text>
  <text x="712" y="188" text-anchor="middle" class="t s">统一隐藏维度</text>
  <text x="712" y="213" text-anchor="middle" class="t xs">形成视觉 token</text>

  <rect x="620" y="280" width="185" height="110" rx="18" fill="#ffedd5" stroke="#f97316" class="box"/>
  <text x="712" y="314" text-anchor="middle" class="t b m">位置表示</text>
  <text x="712" y="343" text-anchor="middle" class="t s">Interleaved-MRoPE</text>
  <text x="712" y="368" text-anchor="middle" class="t xs">表达高度、宽度与时间关系</text>

  <rect x="870" y="145" width="190" height="260" rx="20" fill="#dcfce7" stroke="#22c55e" class="box"/>
  <text x="965" y="180" text-anchor="middle" class="t b m">Qwen 语言模型</text>
  <text x="965" y="215" text-anchor="middle" class="t s">联合关注视觉 token</text>
  <text x="965" y="242" text-anchor="middle" class="t s">与文本 token</text>
  <line x1="900" y1="265" x2="1030" y2="265" stroke="#86efac" stroke-width="2"/>
  <text x="965" y="297" text-anchor="middle" class="t s">语义匹配</text>
  <text x="965" y="326" text-anchor="middle" class="t s">候选比较</text>
  <text x="965" y="355" text-anchor="middle" class="t s">指令遵循</text>
  <text x="965" y="386" text-anchor="middle" class="t xs">自回归生成回答</text>

  <g stroke="#475569" stroke-width="4" marker-end="url(#arrow)">
    <line x1="235" y1="168" x2="295" y2="168"/>
    <line x1="540" y1="180" x2="610" y2="180"/>
    <line x1="805" y1="180" x2="860" y2="215"/>
    <path d="M235 322 H590 Q610 322 610 335" fill="none"/>
    <line x1="805" y1="335" x2="860" y2="335"/>
  </g>
  <g stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#deep)">
    <path d="M505 182 H565 V455 H860 V365" fill="none"/>
    <path d="M505 253 H575 V445 H850 V350" fill="none"/>
  </g>
  <text x="620" y="461" class="t b s" fill="#7c3aed">DeepStack：多层视觉特征注入语言模型</text>

  <line x1="965" y1="405" x2="965" y2="465" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="750" y="480" width="310" height="95" rx="18" fill="#ffffff" stroke="#64748b" class="box"/>
  <text x="905" y="514" text-anchor="middle" class="t b m">结构化输出</text>
  <text x="905" y="546" text-anchor="middle" class="t s">{"target":"blue","reason":"..."}</text>

  <rect x="70" y="505" width="570" height="70" rx="16" fill="#fee2e2" stroke="#ef4444" class="box"/>
  <text x="355" y="534" text-anchor="middle" class="t b s">能力边界</text>
  <text x="355" y="558" text-anchor="middle" class="t s">模型负责语义选择；RGB-D 负责三维坐标，Nav2 负责路径与避障</text>
  <text x="550" y="620" text-anchor="middle" class="t xs">视频时间戳对齐是 Qwen3-VL 的扩展能力，本章静态图像任务不直接使用。</text>
</svg>
