<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <style>.title{font:700 28px sans-serif;fill:#0f172a}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2;rx:16}.safe{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.exec{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.txt{font:20px sans-serif;fill:#0f172a}.small{font:16px sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">机械臂运动规划与执行闭环</text>
  <rect x="35" y="95" width="190" height="100" class="box"/><text x="130" y="132" text-anchor="middle" class="txt">任务目标</text><text x="130" y="164" text-anchor="middle" class="small">末端位姿 / 关节目标</text>
  <rect x="275" y="95" width="190" height="100" class="box"/><text x="370" y="132" text-anchor="middle" class="txt">逆运动学</text><text x="370" y="164" text-anchor="middle" class="small">得到候选 q_goal</text>
  <rect x="515" y="95" width="190" height="100" class="safe"/><text x="610" y="132" text-anchor="middle" class="txt">碰撞规划</text><text x="610" y="164" text-anchor="middle" class="small">关节限位 + 场景 + 自碰撞</text>
  <rect x="755" y="95" width="190" height="100" class="safe"/><text x="850" y="132" text-anchor="middle" class="txt">路径优化</text><text x="850" y="164" text-anchor="middle" class="small">捷径 / 平滑 / 重采样</text>
  <rect x="995" y="95" width="170" height="100" class="safe"/><text x="1080" y="132" text-anchor="middle" class="txt">时间参数化</text><text x="1080" y="164" text-anchor="middle" class="small">位置、速度、时间</text>
  <path d="M225 145 H270" class="arrow"/><path d="M465 145 H510" class="arrow"/><path d="M705 145 H750" class="arrow"/><path d="M945 145 H990" class="arrow"/>
  <rect x="790" y="285" width="250" height="105" class="exec"/><text x="915" y="325" text-anchor="middle" class="txt">轨迹执行器 / 控制桥</text><text x="915" y="356" text-anchor="middle" class="small">FollowJointTrajectory 或关节 drive</text>
  <rect x="455" y="285" width="250" height="105" class="exec"/><text x="580" y="325" text-anchor="middle" class="txt">机械臂与仿真 / 硬件</text><text x="580" y="356" text-anchor="middle" class="small">电机、关节控制器、物理系统</text>
  <rect x="120" y="285" width="250" height="105" class="box"/><text x="245" y="325" text-anchor="middle" class="txt">状态反馈</text><text x="245" y="356" text-anchor="middle" class="small">joint_states、TF、Planning Scene</text>
  <path d="M1080 195 V240 H915 V280" class="arrow"/><path d="M790 337 H710" class="arrow"/><path d="M455 337 H375" class="arrow"/><path d="M245 285 V235 H610 V200" class="arrow"/>
  <rect x="105" y="465" width="990" height="82" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="14"/>
  <text x="600" y="498" text-anchor="middle" class="txt">关键结论：规划成功不等于执行成功</text>
  <text x="600" y="529" text-anchor="middle" class="small">规划层回答“能否找到安全轨迹”，执行层还必须验证控制器连接、实际反馈与最终误差</text>
</svg>
