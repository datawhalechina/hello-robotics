  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>.t{font:700 28px sans-serif;fill:#0f172a}.h{font:700 21px sans-serif;fill:#0f172a}.p{font:18px sans-serif;fill:#334155}.axis{stroke:#64748b;stroke-width:2}.path{stroke:#16a34a;stroke-width:5;fill:none}.bad{stroke:#dc2626;stroke-width:5;fill:none;stroke-dasharray:10 8}.obs{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.arr{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
