<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">自动纠正的三态控制权状态机</title>
  <desc id="desc">POLICY、ACTIVE、RELEASE 三态严格顺序转换；RELEASE 清空旧动作队列并基于纠正后观察重新推理，且只持续一帧。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcff"/><stop offset="1" stop-color="#f2f6fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17365d" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#44658e"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#d46d1f"/></marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#14233c}.sub{font:400 18px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#596a81}.state{font:700 26px Consolas,monospace}.h{font:700 19px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#1b2e4a}.p{font:400 16px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#53657e}.small{font:400 14px 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#53657e}.arrow{fill:none;stroke:#44658e;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="720" y="58" text-anchor="middle" class="title">自动纠正不是“混合动作”，而是严格的控制权交接</text>
  <text x="720" y="91" text-anchor="middle" class="sub">每一帧只有一个动作来源；旧动作块不能跨越纠正边界继续执行</text>

  <!-- trigger panel -->
  <rect x="470" y="116" width="500" height="84" rx="18" fill="#fff4e8" stroke="#e5a15f" stroke-width="2"/>
  <text x="720" y="146" text-anchor="middle" class="h" fill="#a75414">进入纠正的触发器</text>
  <text x="720" y="177" text-anchor="middle" class="p">动作安全异常　·　推理异常　·　任务进度或关节运动停滞</text>
  <path d="M720 200 V244" fill="none" stroke="#d46d1f" stroke-width="4" marker-end="url(#orangeArrow)"/>

  <!-- horizontal transitions -->
  <path class="arrow" d="M405 390 H505"/>
  <path class="arrow" d="M935 390 H1035"/>
  <path class="arrow" d="M1175 524 V595 H265 V524"/>
  <text x="455" y="372" text-anchor="middle" class="small">触发异常 / 停滞</text>
  <text x="985" y="372" text-anchor="middle" class="small">纠正片段结束</text>
  <text x="720" y="620" text-anchor="middle" class="small">fresh inference 完成后，下一帧回到普通策略控制</text>

  <g filter="url(#shadow)">
    <!-- POLICY -->
    <rect x="85" y="255" width="320" height="270" rx="24" fill="#fff" stroke="#65a6b8" stroke-width="3"/>
    <rect x="85" y="255" width="320" height="72" rx="24" fill="#247d91"/><rect x="85" y="303" width="320" height="24" fill="#247d91"/>
    <text x="245" y="300" text-anchor="middle" class="state" fill="#fff">POLICY</text>
    <text x="115" y="365" class="h">控制者：π0.5</text>
    <text x="115" y="400" class="p"><tspan x="115">• 执行策略动作块</tspan><tspan x="115" dy="29">• 保存真实 policy_action</tspan><tspan x="115" dy="29">• 持续检查安全与进度</tspan></text>
    <rect x="115" y="478" width="260" height="28" rx="14" fill="#e6f5f8"/><text x="245" y="497" text-anchor="middle" class="small" fill="#247d91">动作来源唯一：policy</text>

    <!-- ACTIVE -->
    <rect x="505" y="255" width="430" height="270" rx="24" fill="#fff" stroke="#e59345" stroke-width="3"/>
    <rect x="505" y="255" width="430" height="72" rx="24" fill="#cf6d1b"/><rect x="505" y="303" width="430" height="24" fill="#cf6d1b"/>
    <text x="720" y="300" text-anchor="middle" class="state" fill="#fff">ACTIVE</text>
    <text x="535" y="365" class="h">控制者：自动专家（局部 IK 纠正）</text>
    <text x="535" y="400" class="p"><tspan x="535">• 先规划成功，再开始记录纠正动作</tspan><tspan x="535" dy="29">• 只执行最短恢复片段</tspan><tspan x="535" dy="29">• policy_action 强制写为全零</tspan></text>
    <rect x="535" y="478" width="370" height="28" rx="14" fill="#fff0e2"/><text x="720" y="497" text-anchor="middle" class="small" fill="#b45811">pregrasp / grasp_and_lift / place_and_release</text>

    <!-- RELEASE -->
    <rect x="1035" y="255" width="320" height="270" rx="24" fill="#fff" stroke="#8b79ca" stroke-width="3"/>
    <rect x="1035" y="255" width="320" height="72" rx="24" fill="#6851aa"/><rect x="1035" y="303" width="320" height="24" fill="#6851aa"/>
    <text x="1195" y="300" text-anchor="middle" class="state" fill="#fff">RELEASE</text>
    <text x="1065" y="365" class="h">交接帧：必须且仅一帧</text>
    <text x="1065" y="400" class="p"><tspan x="1065">① 清空旧动作队列</tspan><tspan x="1065" dy="29">② 读取纠正后的新观察</tspan><tspan x="1065" dy="29">③ 重新调用策略推理</tspan></text>
    <rect x="1065" y="478" width="260" height="28" rx="14" fill="#f0edfb"/><text x="1195" y="497" text-anchor="middle" class="small" fill="#6851aa">禁止复用纠正前动作块</text>
  </g>

  <!-- stale queue warning -->
  <g>
    <rect x="94" y="655" width="1252" height="66" rx="18" fill="#fff" stroke="#d5dfec"/>
    <circle cx="135" cy="688" r="19" fill="#d84b4b"/><path d="M126 679 L144 697 M144 679 L126 697" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="170" y="683" class="h">错误做法：专家结束后继续消费旧的 50 步策略队列</text>
    <text x="170" y="708" class="small">旧动作基于纠正前的图像与关节状态，可能立刻把机器人带回错误轨迹。</text>
    <text x="1305" y="694" text-anchor="end" style="font:700 16px Consolas,monospace;fill:#6851aa">POLICY → ACTIVE → RELEASE → POLICY</text>
  </g>
</svg>